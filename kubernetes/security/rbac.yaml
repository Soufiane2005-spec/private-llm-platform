apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-viewer
  namespace: llm-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-engineer
  namespace: llm-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-admin
  namespace: llm-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-viewer
  namespace: llm-platform
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-engineer
  namespace: llm-platform
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-admin
  namespace: llm-platform
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-viewer
  namespace: llm-platform
subjects:
  - kind: ServiceAccount
    name: platform-viewer
    namespace: llm-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-engineer
  namespace: llm-platform
subjects:
  - kind: ServiceAccount
    name: platform-engineer
    namespace: llm-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-engineer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-admin
  namespace: llm-platform
subjects:
  - kind: ServiceAccount
    name: platform-admin
    namespace: llm-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-admin