apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-platform
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: ollama
          image: ollama/ollama:0.32.14

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 11434

          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"

            - name: OLLAMA_KEEP_ALIVE
              value: "5m"

            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"

            - name: OLLAMA_NUM_PARALLEL
              value: "1"

          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "6Gi"

          volumeMounts:
            - name: model-storage
              mountPath: /root/.ollama

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-storage

        - name: tmp
          emptyDir: {}
