apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: llm-platform
  labels:
    app: test-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: test-app

  template:
    metadata:
      labels:
        app: test-app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx

            - name: run
              mountPath: /var/run

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: cache
          emptyDir: {}

        - name: run
          emptyDir: {}

        - name: tmp
          emptyDir: {}
