apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: llm-platform
  labels:
    app: test-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: test-app

  template:
    metadata:
      labels:
        app: test-app

    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"