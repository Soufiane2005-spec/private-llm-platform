apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-app
  namespace: llm-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-app
                port:
                  number: 80