apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: llm-platform
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 10
  progressDeadlineSeconds: 120

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      serviceAccountName: platform-engineer
      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: private-llm-api:final
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8000

          env:
            - name: AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AUTH_SECRET_KEY
                  optional: true

            - name: AUTH_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: AUTH_ADMIN_PASSWORD_HASH
                  optional: true

            - name: OLLAMA_BASE_URL
              value: http://ollama:11434

            - name: PROMETHEUS_BASE_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090

            - name: MODEL_DEPLOYMENT_BACKEND
              value: kubernetes

            - name: KUBERNETES_NAMESPACE
              value: llm-platform

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10

          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: api-data
              mountPath: /app/data

      volumes:
        - name: tmp
          emptyDir: {}
        - name: api-data
          persistentVolumeClaim:
            claimName: api-data
