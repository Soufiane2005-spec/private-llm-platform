apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-llm-egress
  namespace: llm-platform
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434

    - to:
        - podSelector:
            matchLabels:
              app: vllm
      ports:
        - protocol: TCP
          port: 8000
