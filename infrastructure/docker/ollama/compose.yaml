name: private-llm-platform-ollama

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.14}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 8G
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - llm_backend

volumes:
  ollama_models:
    name: private-llm-ollama-models

networks:
  llm_backend:
    name: private-llm-backend
    driver: bridge