---
- name: Prepare Kubernetes nodes for the Private LLM Platform
  hosts: kubernetes
  become: true
  gather_facts: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - qemu-guest-agent
        state: present
        update_cache: true

    - name: Enable qemu guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started

    - name: Load kernel modules for Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Apply Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Disable swap for Kubernetes
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Remove active swap entries from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

- name: Prepare GPU workers
  hosts: gpu_workers
  become: true
  gather_facts: false

  tasks:
    - name: Mark GPU runtime requirement
      ansible.builtin.copy:
        dest: /etc/private-llm-platform-gpu-required
        mode: "0644"
        content: |
          This node is intended for vLLM GPU workloads.
          Install NVIDIA drivers, NVIDIA Container Toolkit and the Kubernetes
          NVIDIA Device Plugin before validating vLLM runtime.
