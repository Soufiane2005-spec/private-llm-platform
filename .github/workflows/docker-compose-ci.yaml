name: Docker Compose CI

"on":
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "infrastructure/docker/ollama/**"
      - ".env.example"
      - ".github/workflows/docker-compose-ci.yaml"
  push:
    branches:
      - develop
    paths:
      - "infrastructure/docker/ollama/**"
      - ".env.example"
      - ".github/workflows/docker-compose-ci.yaml"

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Ollama Compose files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CPU configuration
        run: >
          docker compose
          --env-file .env.example
          -f infrastructure/docker/ollama/compose.yaml
          config --quiet

      - name: Validate NVIDIA GPU configuration
        run: >
          docker compose
          --env-file .env.example
          -f infrastructure/docker/ollama/compose.yaml
          -f infrastructure/docker/ollama/compose.gpu-nvidia.yaml
          config --quiet
