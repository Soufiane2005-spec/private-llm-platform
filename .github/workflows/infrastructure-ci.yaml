name: Infrastructure CI

"on":
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "kubernetes/**"
      - ".yamllint.yaml"
      - ".github/workflows/infrastructure-ci.yaml"

  push:
    branches:
      - develop
    paths:
      - "kubernetes/**"
      - ".yamllint.yaml"
      - ".github/workflows/infrastructure-ci.yaml"

permissions:
  contents: read

jobs:
  yaml-lint:
    name: Validate YAML formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint==1.35.1

      - name: Validate Kubernetes YAML
        run: yamllint -c .yamllint.yaml kubernetes

  kubernetes-manifest-validation:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        shell: bash
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          sudo chmod +x /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate local Kubernetes manifests
        shell: bash
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            kubernetes/local

  resource-requirements-check:
    name: Validate workload resource requirements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Check Deployment resource requests and limits
        shell: bash
        run: |
          failed=0

          for manifest in kubernetes/local/*-deployment.yaml; do
            echo "Checking ${manifest}"

            container_count=$(yq \
              '.spec.template.spec.containers | length' \
              "${manifest}")

            for ((i=0; i<container_count; i++)); do
              name=$(yq -r \
                ".spec.template.spec.containers[$i].name" \
                "${manifest}")

              cpu_request=$(yq -r \
                ".spec.template.spec.containers[$i].resources.requests.cpu // \"\"" \
                "${manifest}")

              memory_request=$(yq -r \
                ".spec.template.spec.containers[$i].resources.requests.memory // \"\"" \
                "${manifest}")

              cpu_limit=$(yq -r \
                ".spec.template.spec.containers[$i].resources.limits.cpu // \"\"" \
                "${manifest}")

              memory_limit=$(yq -r \
                ".spec.template.spec.containers[$i].resources.limits.memory // \"\"" \
                "${manifest}")

              if [[ -z "${cpu_request}" || \
                    -z "${memory_request}" || \
                    -z "${cpu_limit}" || \
                    -z "${memory_limit}" ]]; then
                echo "Missing CPU/memory resources for ${name} in ${manifest}"
                failed=1
              fi
            done
          done

          exit "${failed}"

  secret-file-check:
    name: Prevent committed secret files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tracked secret manifests
        shell: bash
        run: |
          if git ls-files "*.secret.yaml" | grep -q .; then
            echo "Real Kubernetes secret manifests must not be committed."
            git ls-files "*.secret.yaml"
            exit 1
          fi

          echo "No tracked .secret.yaml files found."
