[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "private-llm-platform-api"
version = "0.1.0"
description = "Backend service for the Private LLM Platform"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic-settings>=2.15,<2.16",
    "uvicorn[standard]>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=domain",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["domain"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
